name: Publish VS Code extension

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing VS Code extension tag, for example vscode-v0.0.3
        required: true
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: write

concurrency:
  group: publish-vscode-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build VS Code extension
        run: bun run package:vscode

      - name: Upload VSIX
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: mergev VS Code ${{ github.event.inputs.tag || github.ref_name }}
          files: apps/vscode/*.vsix
