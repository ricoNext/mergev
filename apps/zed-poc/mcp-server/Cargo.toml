[package]
name = "mergev-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP (stdio) server exposing mergev-core to Zed's Agent Panel"

[dependencies]
mergev-core = { path = "../../../crates/mergev-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "mergev-mcp"
path = "src/main.rs"
